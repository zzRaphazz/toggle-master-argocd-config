apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-targeting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zzRaphazz/toggle-master-k8s-manifests.git
    targetRevision: main
    path: apps/targeting-service
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
