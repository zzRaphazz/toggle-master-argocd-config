apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zzRaphazz/toggle-master-argocd-config.git
    targetRevision: main
    path: applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
